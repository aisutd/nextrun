[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nextrun-cv"
version = "0.1.0"
description = "Computer-vision stat tracking for pickup basketball"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.9",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pandas>=2.1",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
detect = ["ultralytics>=8.4", "lap>=0.5"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]
train = ["ultralytics>=8.4"]
dev = ["pytest>=8", "httpx>=0.27", "fastapi>=0.110", "python-multipart>=0.0.9"]

[project.scripts]
nextrun = "nextrun_cv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["nextrun_cv*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
