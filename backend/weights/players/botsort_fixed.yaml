# BoT-SORT for a fixed camera (the default). Same settings the tracker sweep picked for the moving-camera config
# (results/tracker_sweep/B_A_noreid.yaml, scored on SportsMOT basketball val with src/scripts/eval_tracking.py),
# minus camera-motion compensation (the camera does not move):
# - match_thresh 0.9 / track_buffer 150: a player found again after an occlusion still matches the lost track
# - with_reid False: the built-in appearance features made ids worse on uniforms (and cost time per frame);
#   identity.stitch joins the remaining lost tracks offline
# On that benchmark (after stitching) vs the old fixed config: id switches 823 -> 591, IDF1 0.464 -> 0.518.
tracker_type: botsort
track_high_thresh: 0.3
track_low_thresh: 0.1
new_track_thresh: 0.4
track_buffer: 150
match_thresh: 0.9
fuse_score: True
gmc_method: none
proximity_thresh: 0.5
appearance_thresh: 0.25
with_reid: False
model: auto
